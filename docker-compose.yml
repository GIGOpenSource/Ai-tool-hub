services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_tool_hub_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./media:/app/media
      - ./logs:/app/logs
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: ai_tool_hub_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./admin/.next/static:/usr/share/nginx/html/admin/static:ro
      - ./fronted/dist:/usr/share/nginx/html/frontend:ro
    depends_on:
      - backend
    networks:
      - app_network

networks:
  app_network:
