worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 100m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    tcp_nopush on;

    # ========== AI Tools Hub 主服务配置 ==========
    server {
        listen 80;
        server_name gigaisystem.com www.gigaisystem.com;

        # 1. 根路径 - 前端 SPA
        location / {
            root /usr/share/pages/frontend;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # 2. API 接口转发到 FastAPI 后端
        location /api/ {
            proxy_pass http://ai_hub_backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            client_max_body_size 100M;
        }

        # 3. 管理后台 - Next.js SSR (通过后端代理)
        location /admin {
            proxy_pass http://ai_hub_backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 4. Admin 静态资源
        location ^~ /_next/static/ {
            alias /usr/share/pages/admin/static/;
            try_files $uri =404;
            expires 365d;
            add_header Cache-Control "public, immutable";
        }

        # 5. 前端静态资源
        location ^~ /assets/ {
            alias /usr/share/pages/frontend/assets/;
            try_files $uri =404;
            expires 365d;
            add_header Cache-Control "public, immutable";
        }

        # 6. 兜底静态资源匹配
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map|mjs|webp|avif)$ {
            try_files $uri /usr/share/pages/frontend/$uri =404;
            expires 365d;
            add_header Cache-Control "public, immutable";
        }

        # 7. 其他所有请求转发到后端
        location ~ / {
            proxy_pass http://ai_hub_backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            client_max_body_size 100M;
        }
    }
}
